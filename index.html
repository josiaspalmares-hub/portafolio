<!doctype html>
<!-- Esto le dice al navegador que es una página HTML moderna. lang="es" = está en español. -->
<html lang="es">
  <!-- HEAD: lo que el visitante NO ve, pero el navegador y Google sí (título, letras, estilos). -->
  <head>
    <meta charset="utf-8" />
    <!-- Hace que la página se adapte al ancho del teléfono -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Josías Palmares · Webs, bots y soporte técnico</title>
    <meta name="description" content="Hago páginas web, bots y soporte técnico remoto para negocios en Caracas y donde estés." />
    <link rel="icon" href="img/logo-jp.svg" />

    <!-- Las dos letras de la marca: una moderna (Space Grotesk) y una elegante en cursiva (Instrument Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Nuestro archivo de estilos (colores, tamaños, posiciones) -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <!-- BODY: todo lo que el visitante SÍ ve -->
  <body>
    <!-- Encabezado fijo arriba: logo a la izquierda y menú a la derecha -->
    <header class="encabezado">
      <a class="encabezado__logo" href="#inicio" aria-label="Ir al inicio">
        <img src="img/logo-jp.svg" alt="" width="40" height="40" />
      </a>
      <nav class="encabezado__menu" aria-label="Menú principal">
        <a href="#trabajos">Trabajos</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </header>

    <main>
      <!--
        ================================================================
        LECCIÓN 1 · TU TURNO 
        Escribe aquí la portada (la primera pantalla que ve la gente).
        Las instrucciones están en el chat. Los estilos ya están listos:
        en cuanto uses las clases correctas, se verá bonito solo.
        ================================================================
      -->

      <!-- (Aquí irán después: Trabajos, Servicios y Contacto) -->

    <section class="hero" id="inicio">
      <p class="hero__etiqueta">Hola, soy Josías</p>

        Páginas web, bots con IA y soporte técnico remoto para negocios en Caracas y donde estés. 
        </p><a class="boton" href="#contacto">Hablemos</a>
    </section>
      
    </main>
  </body>
</html>
